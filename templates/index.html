<!DOCTYPE html>
<html>

<head>

    <title>HW1 Grid World</title>

    <style>

        body{
            font-family:"Times New Roman", serif;
            text-align:center;
            margin-top:20px;
        }

        h1{
            margin-bottom:20px;
        }

        button{
            padding:8px 15px;
            margin:10px;
            cursor:pointer;
            font-size:16px;
        }

        input{
            padding:5px;
            font-size:16px;
        }

        .grid{
            display:grid;
            gap:1px;
            background:#999;
            width:max-content;
            margin:20px auto;
            border:1px solid #666;
        }

        .cell{
            width:60px;
            height:60px;
            background:white;
            border:1px solid #999;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:20px;
            font-weight:bold;

            position:relative;
        }

        .start{
            background:green !important;
            color:white;
        }

        .goal{
            background:red !important;
            color:white;
        }

        .obstacle{
            background:gray !important;
            color:white;
        }

        .container{
            display:flex;
            justify-content:center;
            gap:80px;
            margin-top:30px;
        }

        .title{
            font-size:24px;
            font-weight:bold;
            margin-bottom:10px;
        }

        .value-text{
            font-size:14px;
        }

    </style>

</head>

<body>

    <h1>Grid World Reinforcement Learning</h1>

    <div>

        Enter n (5~9):

        <input
            type="number"
            id="gridSize"
            min="5"
            max="9"
            value="5"
        >

        <button onclick="createGrid()">
            Generate Grid
        </button>

    </div>

    <div id="setupGrid" class="grid"></div>

    <button
        id="runBtn"
        style="display:none;"
        onclick="runEvaluation()"
    >
        Run Value Iteration
    </button>

    <div
        class="container"
        id="resultArea"
        style="display:none;"
    >

        <div>

            <div class="title">
                Value Matrix
            </div>

            <div id="valueGrid" class="grid"></div>

        </div>

        <div>

            <div class="title">
                Policy Matrix
            </div>

            <div id="policyGrid" class="grid"></div>

        </div>

    </div>

    <script>

        let startIdx = null
        let goalIdx = null
        let obstacles = []

        function createGrid(){

            const n =
                parseInt(
                    document.getElementById("gridSize").value
                )

            const container =
                document.getElementById("setupGrid")

            container.innerHTML = ""

            container.style.gridTemplateColumns =
                `repeat(${n}, 62px)`

            startIdx = null
            goalIdx = null
            obstacles = []

            document.getElementById("resultArea")
                .style.display = "none"

            for(let i=0;i<n*n;i++){

                const cell =
                    document.createElement("div")

                cell.className = "cell"

                cell.innerText = i + 1

                cell.onclick = function(){

                    if(startIdx === null){

                        startIdx = i
                        cell.classList.add("start")

                    }
                    else if(
                        goalIdx === null &&
                        i !== startIdx
                    ){

                        goalIdx = i
                        cell.classList.add("goal")

                    }
                    else if(
                        i !== startIdx &&
                        i !== goalIdx
                    ){

                        cell.classList.toggle("obstacle")

                        if(cell.classList.contains("obstacle")){

                            obstacles.push(i)

                        }else{

                            obstacles =
                                obstacles.filter(
                                    x => x !== i
                                )
                        }
                    }
                }

                container.appendChild(cell)
            }

            document.getElementById("runBtn")
                .style.display = "inline-block"
        }

        async function runEvaluation(){

            const n =
                parseInt(
                    document.getElementById("gridSize").value
                )

            const response =
                await fetch("/evaluate",{

                    method:"POST",

                    headers:{
                        "Content-Type":"application/json"
                    },

                    body:JSON.stringify({

                        n:n,

                        start:[
                            Math.floor(startIdx / n),
                            startIdx % n
                        ],

                        goal:[
                            Math.floor(goalIdx / n),
                            goalIdx % n
                        ],

                        obstacles:
                            obstacles.map(x => [
                                Math.floor(x / n),
                                x % n
                            ])
                    })
                })

            const data = await response.json()

            document.getElementById("resultArea")
                .style.display = "flex"

            renderValueGrid(
                n,
                data.values
            )

            renderPolicyGrid(
                n,
                data.policy
            )
        }

        function renderValueGrid(n, values){

            const container =
                document.getElementById("valueGrid")

            container.innerHTML = ""

            container.style.gridTemplateColumns =
                `repeat(${n}, 62px)`

            let count = 0

            for(let r=0;r<n;r++){

                for(let c=0;c<n;c++){

                    const cell =
                        document.createElement("div")

                    cell.className = "cell"

                    if(count === startIdx){
                        cell.classList.add("start")
                    }

                    if(count === goalIdx){
                        cell.classList.add("goal")
                    }

                    if(obstacles.includes(count)){
                        cell.classList.add("obstacle")
                    }

                    if(!obstacles.includes(count)){

                        cell.innerHTML = `
                            <div class="value-text">
                                ${values[r][c].toFixed(2)}
                            </div>
                        `
                    }

                    container.appendChild(cell)

                    count++
                }
            }
        }

        function renderPolicyGrid(n, policy){

            const container =
                document.getElementById("policyGrid")

            container.innerHTML = ""

            container.style.gridTemplateColumns =
                `repeat(${n}, 62px)`

            let count = 0

            for(let r=0;r<n;r++){

                for(let c=0;c<n;c++){

                    const cell =
                        document.createElement("div")

                    cell.className = "cell"

                    if(count === startIdx){
                        cell.classList.add("start")
                    }

                    if(count === goalIdx){
                        cell.classList.add("goal")
                    }

                    if(obstacles.includes(count)){
                        cell.classList.add("obstacle")
                    }

                    if(!obstacles.includes(count)){

                        cell.innerHTML = `
                            ${policy[r][c]}
                        `
                    }

                    container.appendChild(cell)

                    count++
                }
            }
        }

    </script>

</body>

</html>
